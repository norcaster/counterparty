name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: norcaster-counterparty (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the built wheel and test it
        run: |
          python -m pip install pytest "$(ls dist/*.whl)"
          norcaster-counterparty --help
          pytest -q

  openai-agents:
    name: Agent SDK bindings and local MCP proxy (extras, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      # The pinned SDK against a local MCP server and the sandbox log on 127.0.0.1; no model API is
      # called. The runner's preinstalled Node runs the Node verifier.
      - name: Install the built wheel with the extra and test it
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install pytest uvicorn "$(ls dist/*.whl)[openai-agents,claude-agent-sdk]"
          pytest -q -rs test/test_openai_agents.py test/test_proxy.py test/test_claude.py test/test_optional_extras.py
      - name: Google ADK adapter (Python 3.11 or later)
        if: matrix.python != '3.10'
        run: |
          python -m pip install "$(ls dist/*.whl)[google-adk]"
          pytest -q -rs test/test_google_adk.py
      - name: LangGraph adapter (langchain-mcp-adapters needs the MCP SDK 1.x)
        run: |
          python -m pip install "$(ls dist/*.whl)[langgraph]" "langgraph>=1.2,<2"
          pytest -q -rs test/test_langgraph.py test/test_proxy.py

  windows:
    name: Cross-process lock on Windows (msvcrt)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install and test the lock
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest .
          pytest -q test/test_locks.py test/test_counterparty.py

  image:
    name: Container image builds and runs as 10001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Build
        run: docker build -t counterparty:ci .
      - name: Runs non-root on a read-only root
        run: |
          test "$(docker image inspect counterparty:ci --format '{{.Config.User}}')" = "10001"
          docker run --rm --user 1000870000:0 --read-only --tmpfs /tmp counterparty:ci --help
      - name: The local MCP proxy is in the image
        run: |
          docker image inspect counterparty:ci --format '{{json .Config.ExposedPorts}}' | grep -q '"8790/tcp"'
          docker run --rm --user 1000870000:0 --read-only --tmpfs /tmp counterparty:ci proxy serve --help
          docker run --rm --user 1000870000:0 --read-only --tmpfs /tmp counterparty:ci proxy stdio --help
          docker run --rm --user 1000870000:0 --read-only --tmpfs /tmp --entrypoint python counterparty:ci \
            -c "import norcaster_counterparty.proxy, mcp.server.lowlevel, uvicorn"
